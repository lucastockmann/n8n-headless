version: '3.8'

services:
  n8n:
    build: .
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - TZ=${TZ:-UTC}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Task runners (external mode for Python + JS code node support)
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN is required}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      # Browserless connection
      - PUPPETEER_WS_ENDPOINT=ws://browserless:3000
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - browserless
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Task runner sidecar (handles Python + JS code execution)
  n8n-runner:
    image: n8nio/runners:latest
    network_mode: "service:n8n"
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN is required}
      - N8N_RUNNERS_MAX_CONCURRENCY=5
      - N8N_RUNNERS_TASK_BROKER_URI=http://localhost:5679
    restart: unless-stopped

  browserless:
    image: browserless/chrome:latest
    ports:
      - "3000:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=${BROWSERLESS_MAX_SESSIONS:-5}
      - CONNECTION_TIMEOUT=${BROWSERLESS_TIMEOUT:-60000}
      - TOKEN=${BROWSERLESS_TOKEN:-}
    shm_size: '2gb'
    restart: unless-stopped

volumes:
  n8n_data:
